version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omniconvert_backend
    ports:
      - "8000:8000"
    environment:
      - MAX_FILE_SIZE_MB=25
      - FILE_TTL_SECONDS=3600
      - CLEANUP_INTERVAL_SECONDS=300
    volumes:
      - ./backend/temp_storage:/app/temp_storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omniconvert_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
